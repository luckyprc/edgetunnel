name: Auto Update CF Best IP

on:
  schedule:
    - cron: '0 2 * * *'   # 每天北京时间 10:00
  workflow_dispatch:       # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 解决 push 冲突需要完整历史

      - name: Merge Public APIs
        run: |
          # 国内公共API（国内网友每天测的，比国外runner准）
          curl -sL --retry 3 --max-time 15 https://cf.001315.xyz/ct > ct.txt || touch ct.txt
          curl -sL --retry 3 --max-time 15 https://cf.001315.xyz/cu > cu.txt || touch cu.txt
          curl -sL --retry 3 --max-time 15 https://cf.001315.xyz/cmcc > cm.txt || touch cm.txt
          curl -sL --retry 3 --max-time 15 https://cf.001315.xyz/CloudFlareYes > cf.txt || touch cf.txt
          
          # 严格过滤：只保留 IP 格式行，排除 HTML/JS/乱码
          cat ct.txt cu.txt cm.txt cf.txt | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | \
            grep -v '^$' | \
            sort -u > merged_ips.txt
          
          echo "=== 合并后共 $(wc -l < merged_ips.txt) 个有效IP ==="
          head -20 merged_ips.txt

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 先拉取远程最新，避免 upstream sync 导致冲突
          git pull --rebase origin main || true
          
          git add merged_ips.txt
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: update CF IPs $(date +%Y-%m-%d-%H:%M)"
            git push --force-with-lease origin main
            echo "Pushed updated IPs"
          fi

      - name: Cleanup
        if: always()
        run: rm -f ct.txt cu.txt cm.txt cf.txt

name: Auto Update CF Best IP

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download CloudflareSpeedTest
        run: |
          wget -q -N https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz
          tar -zxf cfst_linux_amd64.tar.gz
          chmod +x cfst

      - name: Run Speed Test
        run: |
          ./cfst -n 200 -t 4 -dn 20 -dt 10 -tp 443 -o result.csv || true
          if [ -f result.csv ] && [ "$(wc -l < result.csv)" -gt 1 ]; then
            awk -F, 'NR>1 && NR<=21 {print $1":443#CF优选"}' result.csv > my_ips.txt
          else
            touch my_ips.txt
          fi

      - name: Merge with Public API
        run: |
          # 拉取外部 API（GitHub Raw 通常不会被 CF 拦截）
          curl -sL --retry 3 --max-time 15 \
            https://raw.githubusercontent.com/cmliu/WorkerVless2sub/main/addressesapi.txt > api_raw.txt || touch api_raw.txt
          
          # ========== 关键修复：严格过滤，只保留 IP:端口#备注 格式的行 ==========
          # 过滤规则：必须以数字开头（IP格式），排除所有 HTML/JS/乱码
          cat my_ips.txt api_raw.txt | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | \
            grep -v '^$' | \
            sort -u > merged_ips.txt
          
          # 验证结果
          total=$(wc -l < merged_ips.txt)
          echo "=== 合并后共 ${total} 个有效 IP ==="
          head -30 merged_ips.txt

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull --rebase origin main || true
          
          git add merged_ips.txt
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: merge best IPs $(date +%Y-%m-%d-%H:%M)"
            git push --force-with-lease origin main
            echo "Pushed merged IPs"
          fi

      - name: Cleanup
        if: always()
        run: rm -f result.csv cfst cfst_linux_amd64.tar.gz api_raw.txt my_ips.txt
